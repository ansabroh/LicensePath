name: Contract checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: genvm-lint download --version v0.2.16
      - run: python -m pytest
      - run: genvm-lint check contracts/license_path.py
      - run: genvm-lint typecheck contracts/license_path.py
      - run: genvm-lint schema contracts/license_path.py --output /tmp/abi.json
      - run: diff docs/abi.json /tmp/abi.json
      - run: python scripts/prepare_demo.py && git diff --exit-code -- fixtures
